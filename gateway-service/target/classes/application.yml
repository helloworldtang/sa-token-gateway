server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user(?<segment>/?.*), /user$\{segment}
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/order/**
          filters:
            - RewritePath=/api/order(?<segment>/?.*), /order$\{segment}
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: true

# Knife4j Swagger 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
