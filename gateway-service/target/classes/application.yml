server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/order/**
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: true
