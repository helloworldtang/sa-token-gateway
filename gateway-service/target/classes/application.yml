server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # 用户服务路由 - 前缀 /user -> 后端 /
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
          filters:
            - RewritePath=/user(?<segment>/?.*), $\{segment}
        # 订单服务路由 - 前缀 /order -> 后端 /
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/order/**
          filters:
            - RewritePath=/order(?<segment>/?.*), $\{segment}
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: true
