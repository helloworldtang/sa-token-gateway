server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # ===== users 服务 =====
        - id: users-doc
          uri: http://localhost:8081
          predicates:
            - Path=/users/doc.html
          filters:
            - SetPath=/doc.html
        - id: users-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/users/v3/api-docs/**
          filters:
            - RewritePath=/users/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
        - id: users-api-docs-root
          uri: http://localhost:8081
          predicates:
            - Path=/users/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: users-swagger-ui
          uri: http://localhost:8081
          predicates:
            - Path=/users/swagger-ui/**
          filters:
            - RewritePath=/users/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: users-webjars
          uri: http://localhost:8081
          predicates:
            - Path=/users/webjars/**
          filters:
            - RewritePath=/users/webjars/(?<segment>.*), /webjars/${segment}
        - id: users-auth
          uri: http://localhost:8081
          predicates:
            - Path=/users/auth/**
          filters:
            - RewritePath=/users/auth/(?<segment>.*), /auth/${segment}
        - id: users-other
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        # ===== orders 服务 =====
        # 更具体的路由必须在前面，否则会被 catch-all 路由先匹配
        
        # 1. 订单业务路由：/orders/order/** → /order/**
        - id: orders-business
          uri: http://localhost:8082
          predicates:
            - Path=/orders/order/**
          filters:
            # 去掉 /orders 前缀，保留 /order/**
            - StripPrefix=1
        
        # 2. 文档和 API 相关路由
        - id: orders-doc
          uri: http://localhost:8082
          predicates:
            - Path=/orders/doc.html
          filters:
            - SetPath=/doc.html
        - id: orders-api-docs
          uri: http://localhost:8082
          predicates:
            - Path=/orders/v3/api-docs/**
          filters:
            - RewritePath=/orders/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
        - id: orders-api-docs-root
          uri: http://localhost:8082
          predicates:
            - Path=/orders/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: orders-swagger-ui
          uri: http://localhost:8082
          predicates:
            - Path=/orders/swagger-ui/**
          filters:
            - RewritePath=/orders/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: orders-webjars
          uri: http://localhost:8082
          predicates:
            - Path=/orders/webjars/**
          filters:
            - RewritePath=/orders/webjars/(?<segment>.*), /webjars/${segment}
        
        # 3. 其他路由（catch-all）
        - id: orders-other
          uri: http://localhost:8082
          predicates:
            - Path=/orders/**
          filters:
            # 去掉 /orders 前缀
            - StripPrefix=1

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: true

# SpringDoc 配置：Swagger UI 下拉菜单
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 下拉菜单中显示所有后端服务
    urls:
      - url: /v3/api-docs/users
        name: 用户服务 (User Service)
      - url: /v3/api-docs/orders
        name: 订单服务 (Order Service)
    # 默认选中第一个
    urls-primary-name: 用户服务 (User Service)
  api-docs:
    path: /v3/api-docs

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    # 显示服务下拉菜单
    enable-swagger-select: true

# 应用配置
app:
  gateway:
    swagger:
      enabled: true
      username: admin
      password: swagger123