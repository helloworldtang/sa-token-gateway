server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes: []
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10s

sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: true

# 应用配置（支持配置中心动态更新）
app:
  gateway:
    swagger:
      enabled: true        # 生产环境设为 false
      username: admin
      password: swagger123