server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# Sa-Token 配置
sa-token:
  # Token 名称
  token-name: satoken
  # Token 有效期（30天）
  timeout: 2592000
  # Token 风格
  token-style: uuid
  # 是否输出日志
  is-log: true
  # Cookie 配置
  is-read-cookie: true
  # Header 配置
  is-read-header: true

# Redis 配置（分布式 Session）
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
