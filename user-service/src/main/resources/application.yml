server:
  port: 8081

spring:
  application:
    name: user-service
  redis:
    host: localhost
    port: 6379
    database: 0

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: true

# Knife4j Swagger 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # 通过网关访问时的前缀（让 Swagger UI 请求 api-docs 时带上正确路径）
  server-prefix: /users